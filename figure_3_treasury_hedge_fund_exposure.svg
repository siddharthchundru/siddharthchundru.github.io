<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="title desc">
  <title id="title">Estimated uses of large hedge funds’ long Treasury exposure</title>
  <desc id="desc">A horizontal bar chart decomposes $2.4 trillion of estimated long Treasury exposure as of September 2025: 830 billion basis trades, 395 maturity-matched trades, 375 steepener-like, 305 swap-spread arbitrage, 245 unencumbered cash, 175 flattener-like, and 70 long-only investments.</desc>
  <style>.bg{fill:#fcfcfb}.ink{fill:#171717}.muted{fill:#696966}.rule{stroke:#b9b9b4;stroke-width:1}.bar{fill:#181818}.bar2{fill:#8b8b86}.h{font:700 29px Arial,Helvetica,sans-serif}.kick{font:700 18px Arial,Helvetica,sans-serif;letter-spacing:2.3px}.lab{font:700 20px Arial,Helvetica,sans-serif}.sm{font:17px Arial,Helvetica,sans-serif}.num{font:700 20px Arial,Helvetica,sans-serif}.serif{font:22px Georgia,'Times New Roman',serif}</style>
  <rect class="bg" width="1800" height="1020"/>
  <text x="90" y="86" class="kick ink">FIGURE 3</text><text x="90" y="135" class="h ink">Large hedge funds’ Treasury exposure contains substantial leveraged relative-value activity</text><text x="90" y="171" class="serif muted">Estimated components of $2.4 trillion in long Treasury exposure, September 2025.</text><line x1="90" y1="212" x2="1710" y2="212" class="rule"/>
  <text x="90" y="270" class="kick muted">ESTIMATED USE OF LONG EXPOSURE</text><text x="1450" y="270" class="kick muted">US$ BILLIONS</text>
  <line x1="510" y1="330" x2="1550" y2="330" class="rule"/><line x1="510" y1="330" x2="510" y2="826" class="rule"/>
  <text x="500" y="862" class="sm muted">0</text><text x="748" y="862" class="sm muted">200</text><text x="998" y="862" class="sm muted">400</text><text x="1248" y="862" class="sm muted">600</text><text x="1490" y="862" class="sm muted">800</text>
  <g class="lab ink"><text x="90" y="389">Cash-futures basis</text><text x="90" y="457">Maturity-matched trades</text><text x="90" y="525">Steepener-like trades</text><text x="90" y="593">Swap-spread arbitrage</text><text x="90" y="661">Unencumbered Treasury cash</text><text x="90" y="729">Flattener-like trades</text><text x="90" y="797">Long-only investment uses</text></g>
  <g><rect x="510" y="360" width="1037" height="36" class="bar"/><rect x="510" y="428" width="494" height="36" class="bar2"/><rect x="510" y="496" width="469" height="36" class="bar2"/><rect x="510" y="564" width="381" height="36" class="bar2"/><rect x="510" y="632" width="306" height="36" class="bar2"/><rect x="510" y="700" width="219" height="36" class="bar2"/><rect x="510" y="768" width="88" height="36" class="bar2"/></g>
  <g class="num ink"><text x="1570" y="389">$830B</text><text x="1027" y="457">$395B</text><text x="1002" y="525">$375B</text><text x="914" y="593">$305B</text><text x="839" y="661">$245B</text><text x="752" y="729">$175B</text><text x="621" y="797">$70B</text></g>
  <line x1="90" y1="908" x2="1710" y2="908" class="rule"/><text x="90" y="944" class="sm ink">Basis and swap-spread positions alone account for about half of estimated long exposure—an important funding sensitivity, not proof of a Treasury crisis.</text><text x="90" y="985" class="sm muted">Source: Federal Reserve, “Decomposing Hedge Funds’ U.S. Treasury Exposures” (June 2026). Form PF-based proxy estimates; categories are mutually exclusive.</text>
</svg>
